[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave-bazzite
balanced=balanced-bazzite
# Bazzite's throughput profile plus no PCIe power saving (hyprbazzite-performance)
performance=hyprbazzite-performance

[battery]
# PPD = TuneD
# No performance entry on purpose: performance stays performance on battery.
balanced=balanced-battery-bazzite
power-saver=powersave-battery-bazzite
