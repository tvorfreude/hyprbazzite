# hypridle configuration — the Hyprland-native idle daemon (replaces swayidle).
# Deployed to /etc/hypr/hypridle.conf via tmpfiles (copy of /usr/lib/hyprbazzite/hypr).
# Autostarted by hypr/autostart.lua as a bare `hypridle` (reads this file).

general {
    # Locking is centralized through loginctl lock-session -> lock_cmd, so the
    # timeout and before-sleep paths never spawn a second hyprlock instance.
    lock_cmd = pidof hyprlock || hyprlock -c /etc/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    # `hyprctl dispatch` doesn't work on this build (native Lua config engine,
    # "non-legacy parser") - these go through `hyprctl eval` calling hl.dsp
    # directly, same as the config files.
    #
    # No lid re-sync needed here: hyprbazzite-lid.service (systemd --user)
    # reacts to logind's own PrepareForSleep(false) signal independently on
    # every resume, lid-triggered or not - adding a second one here would
    # just race it for no benefit.
    #
    # Retried a few times: after a real S3 resume the outputs come back (and
    # get re-probed, see hyprbazzite-drm-reprobe) a few seconds after logind's
    # PrepareForSleep(false) fires, and a single dpms(true) sent before then
    # lands on an output that doesn't exist yet - leaving the monitors black.
    after_sleep_cmd = sh -c 'for d in 0 2 3 5; do sleep $d; hyprctl eval "hl.dispatch(hl.dsp.dpms(true))"; done'
}

# Lock the screen after 5 minutes of inactivity.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn displays off after 10 minutes; back on when activity resumes.
listener {
    timeout = 600
    on-timeout = hyprctl eval "hl.dispatch(hl.dsp.dpms(false))"
    on-resume = hyprctl eval "hl.dispatch(hl.dsp.dpms(true))"
}
