source = /etc/hypr/wallust/wallust-hyprland.conf
$Scripts = /etc/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    no_fade_in = false
}

background {
    monitor =
    # The wallpaper picker (hyprbazzite-ctl) writes here, under the user's own
    # config dir - NOT /etc/hypr, which is wiped and recopied from the static
    # shipped template on every boot and could never hold per-user state.
    path = $HOME/.config/hypr/wallust/current_wallpaper.png
    color = rgb(0,0,0)
    blur_size = 6
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

# Same look as waybar/swaync/wofi: Dracula glass, regular weights, soft white
# edges, purple only for focus/success, red for failure. Keep the layout in
# sync with sddm/themes/hyprlockish/Main.qml.

# -- Date --
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(248, 248, 242, 0.75)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# -- Time --
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $foreground
    font_size = 140
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# -- Input Field (glass pill) --
input-field {
    monitor =
    size = 320, 48
    rounding = -1
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(248, 248, 242, 0.15)
    inner_color = rgba(40, 42, 54, 0.55)
    font_color = $foreground
    check_color = $purple
    fail_color = $red
    capslock_color = $orange
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##f8f8f2" opacity="0.5">Type password</span>
    fail_text = <span foreground="##ff5555">Incorrect</span>
    hide_input = false
    position = 0, 120
    halign = center
    valign = bottom
}

# -- Keyboard Layout Indicator --
label {
    monitor =
    text = $LAYOUT
    color = rgba(248, 248, 242, 0.6)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = top
}

# -- Uptime (bottom-right) --
label {
    monitor =
    text = cmd[update:60000] echo "$(uptime -p 2>/dev/null || echo 'Up')"
    color = rgba(248, 248, 242, 0.55)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -40, 40
    halign = right
    valign = bottom
}

# -- Weather (bottom-left, graceful fallback) --
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache" || echo ""
    color = rgba(248, 248, 242, 0.55)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 40, 40
    halign = left
    valign = bottom
}
