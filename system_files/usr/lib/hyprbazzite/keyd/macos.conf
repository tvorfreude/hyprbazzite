# keyd configuration: macOS-style keyboard layout for PC keyboards
#
# Physical PC layout:  Ctrl | Super | Alt | Space
# MacBook layout:      Ctrl | Opt   | Cmd | Space
#
# Goal: Make the physical key next to space (Alt on PC) act like macOS Cmd.
# The key one position further left (Super on PC) acts like macOS Option.
#
# Remap:
#   Physical Alt (next to space) → Ctrl  (so Alt+C = Ctrl+C = Copy, like Cmd+C)
#   Physical Super → Alt                 (so Super = Option for WM, like AeroSpace)
#   Physical Ctrl stays Ctrl             (for terminal/legacy use)
#
# This means:
#   - Apps see Ctrl+C/V/X/Z when you press the key next to space + letter
#   - Hyprland sees ALT for WM operations (bound to physical Super key)
#   - Your muscle memory from macOS transfers directly

[ids]
*

[main]
# Physical Alt (next to space) becomes Ctrl → app shortcuts (Cmd equivalent)
leftalt = leftcontrol
rightalt = rightcontrol

# Physical Super (one key left of Alt) becomes Alt → WM modifier
leftmeta = leftalt
rightmeta = rightalt

# Physical Ctrl stays as Ctrl (bottom-left corner, unchanged)
leftcontrol = leftcontrol
rightcontrol = rightcontrol
