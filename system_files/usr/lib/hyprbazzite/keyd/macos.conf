# keyd configuration: macOS-style Super/Cmd → Ctrl remap
# Makes the physical Cmd/Super key behave like macOS Cmd in Linux apps.
#
# This is ONLY loaded when the "macos" keybind profile is active.
# The WM modifier (Alt) is untouched — it goes straight to Hyprland.
#
# How it works:
#   Physical Super/Cmd → sends Ctrl to applications
#   So Super+C = Ctrl+C (copy), Super+V = Ctrl+V (paste), etc.
#   Exactly like Cmd+C/V on macOS.
#
# Exceptions (handled by Hyprland before reaching apps):
#   Super+Shift+3/4/5 = screenshots (grabbed by Hyprland)
#   Super+Ctrl+Q = lock screen (grabbed by Hyprland)
#   Super+Space = launcher (grabbed by Hyprland)

[ids]
*

[main]
# Remap Super (left and right) to act as Ctrl
leftmeta = leftcontrol
rightmeta = rightcontrol

# Preserve original Ctrl keys as-is (they still work as Ctrl)
leftcontrol = leftcontrol
rightcontrol = rightcontrol
