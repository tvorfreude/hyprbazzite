# AllowHibernation=yes agrees with /usr/lib/systemd/sleep.conf.d/hibernate.conf
# (also ours) on purpose, not by coincidence - these used to silently
# disagree (this file said "no", that one said "yes"), and because systemd
# merges sleep.conf.d drop-ins by filename across /etc and /usr/lib
# together, not by directory precedence, "hibernate.conf" sorted after
# "90-tblue-hibernate.conf" and silently won every time (confirmed live via
# `systemd-analyze cat-config systemd/sleep.conf`) - this file's old "no"
# was never actually in effect. Settled on "yes": plain hibernate is the
# last link in logind's SleepOperation= fallback chain (suspend-then-
# hibernate -> suspend -> hibernate, see the logind.conf.d drop-in and
# _sleep_best_effort()), only ever reached if even plain suspend somehow
# isn't supported - there's no path in this project that invokes bare
# hibernate directly, so allowing it only adds one more rung to that
# fallback ladder with no real downside.
[Sleep]
AllowHibernation=yes
AllowSuspend=yes
AllowSuspendThenHibernate=yes
