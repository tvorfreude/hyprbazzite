# hyprbazzite: delegate ALL lid handling to the Hyprland compositor.
#
# The Hyprland "switch:on/off:Lid Switch" binds (see hypr/bindings.lua) call
# /etc/hypr/scripts/lidact.sh, which decides between clamshell mode (disable the
# internal panel while docked) and sleep (suspend-then-hibernate when undocked).
#
# If logind ALSO acted on the lid it would race the compositor and suspend the
# machine even when docked, so we make logind ignore the lid in all cases and
# leave the compositor as the single authority.
#
# NOTE: this means lid handling only works while Hyprland is running. On the
# SDDM/login screen (no Hyprland session) the lid does nothing; suspend there
# still works via the power button / power menu.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
