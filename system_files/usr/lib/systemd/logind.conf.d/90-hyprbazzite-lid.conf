# hyprbazzite: let logind handle the suspend/no-suspend decision natively,
# and leave only the cosmetic clamshell action (blanking the internal panel)
# to hyprbazzite-lid.service.
#
# logind already has a built-in notion of "docked" (more than one display
# connected, or a docking station) - see logind.conf(5) - which is exactly
# the suspend-vs-clamshell decision we previously hand-rolled in
# hyprbazzite-ctl's lid module via hyprctl+jq. Using it natively means:
#   - lid-close-to-sleep now also works at the SDDM greeter and anywhere else
#     before a Hyprland session exists (the old all-ignore config meant lid
#     handling only worked once Hyprland was running).
#   - one less place to keep logind's and our own docked-detection in sync.
#
# HandleLidSwitchDocked=ignore: while docked, logind does nothing -
# hyprbazzite-lid.service (reacting to logind's own LidClosed property)
# still blanks/restores the internal panel for true clamshell visuals,
# since logind has no concept of disabling a specific output.
#
# HandleLidSwitch=/HandleLidSwitchExternalPower=sleep: undocked, lid closed
# -> sleep, whether on battery or AC power (matches real laptop/clamshell
# behavior: only an external *display* keeps it awake, not just a charger).
# "sleep", not "suspend-then-hibernate" directly: the generic action defers
# to logind's own SleepOperation= chain (systemd 256+, this image ships
# 259), which tries suspend-then-hibernate, then suspend, then hibernate,
# using the first one the hardware actually supports - a laptop left closed
# long enough (packed in a bag for travel) ideally falls back to a real
# hibernate instead of slowly draining the battery in RAM-suspend the whole
# time, but hibernation support varies a lot across hardware and isn't
# guaranteed. Confirmed live this isn't just a theoretical concern: on this
# very machine CanSuspendThenHibernate/CanHibernate both report "na"
# (Secure Boot's lockdown=integrity mode disables kernel hibernation
# outright), so hardcoding suspend-then-hibernate directly would silently
# do nothing instead of sleeping at all. "sleep" means this always actually
# sleeps, with the best method available, on any machine.
#
# NOTE: logind only evaluates "docked" at the moment the physical switch
# fires - it won't react if the last external display is unplugged while
# already closed. hyprbazzite-ctl's automation_dnd listener still handles
# that case itself (see lid_sync() in the lid module), using the same
# "sleep" fallback via _sleep_best_effort().
[Login]
HandleLidSwitch=sleep
HandleLidSwitchExternalPower=sleep
HandleLidSwitchDocked=ignore
